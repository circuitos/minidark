<!DOCTYPE html>
<!-- ==========================================================================
  MINIDARK — a tiny dark-synth studio for absolute beginners.
  Late-80s industrial / dark synth-pop palette. Web Audio only, no server,
  no build step, no localStorage (persistence = project file export).

  ARCHITECTURE (loud banners in each file):
    THEME    css/theme.css        — every design token; restyle here only
    UI       css/app.css, js/ui/* — components; tokens + CONTENT keys only
    CONTENT  js/content.js        — every user-facing string
    ENGINE   js/engine/*          — audio graph, voices, clock, export
    DATA     js/library.js        — SOUND_LIBRARY registry (schema in file)
             js/demos.js          — three original demo tracks

  JUDGMENT CALL: classic <script> tags (one global: MDS) instead of ES
  modules, so the app also works from file:// where module CORS rules bite.
  Load order below IS the dependency order.
=========================================================================== -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MINIDARK — a tiny dark-synth studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d0e11'/%3E%3Ccircle cx='8' cy='8' r='4' fill='none' stroke='%23e0483c' stroke-width='2'/%3E%3Cline x1='8' y1='8' x2='11' y2='5' stroke='%23e8eaef' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app"></div>

  <script>
    /* MP3 encoder (lamejs) from cdnjs — the ONLY external dependency, and an
       optional one: export degrades gracefully to WAV-only with a visible
       notice if this fails to load (see js/ui/exportui.js).
       Path verified against the lamejs 1.2.0 npm package (same file cdnjs
       mirrors); cdnjs itself was unreachable from the build environment's
       network, so the runtime onload/onerror handling below is load-bearing. */
    window.MDS = window.MDS || {};
    MDS.LAME_STATE = "loading";
  </script>
  <script async
    src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"
    onload="MDS.LAME_STATE='ok'"
    onerror="MDS.LAME_STATE='failed'"></script>

  <!-- CONTENT -->
  <script src="js/content.js"></script>
  <!-- ENGINE -->
  <script src="js/engine/dsp.js"></script>
  <script src="js/engine/graph.js"></script>
  <script src="js/engine/synth.js"></script>
  <script src="js/engine/sequencer.js"></script>
  <script src="js/engine/export.js"></script>
  <!-- DATA -->
  <script src="js/library.js"></script>
  <script src="js/state.js"></script>
  <script src="js/demos.js"></script>
  <!-- UI -->
  <script src="js/ui/knob.js"></script>
  <script src="js/ui/tooltip.js"></script>
  <script src="js/ui/seq.js"></script>
  <script src="js/ui/keyboard.js"></script>
  <script src="js/ui/panels.js"></script>
  <script src="js/ui/lessons.js"></script>
  <script src="js/ui/exportui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
